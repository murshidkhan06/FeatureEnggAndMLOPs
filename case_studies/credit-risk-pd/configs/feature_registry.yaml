- name: util_x_missed
  version: 1
  definition: 'Interaction: card utilisation x missed payments (heavy card users who also miss instalments).'
  source: 'derived: credit_utilization, missed_payment_count'
  data_type: float
  owner: retail-risk-analytics
  calculation_logic: credit_utilization * missed_payment_count
  window: same as parents
  availability:
    lag_days: 5
    rule: available_at <= as_of_date
  prediction_time_availability: YES - computed by add_derived_features() from credit_utilization, missed_payment_count; inherits the availability
    of its parents.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-10-31'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-11-14'
