# Serves the built React app. The browser talks to the orchestrator directly (CORS),
# so nginx only needs to serve static files.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  location / { try_files $uri /index.html; }
}
