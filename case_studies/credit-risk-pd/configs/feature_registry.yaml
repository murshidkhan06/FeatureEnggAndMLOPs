    note: Added to the monthly feature pipeline and the online lookup.
- name: income_stability
  version: 1
  definition: 'How regular the salary amount is: coefficient of variation (std / mean) of salary amounts over 6 months. Higher = less stable.'
  source: transactions.amount where txn_type == salary_credit
  data_type: float (>= 0)
  owner: retail-risk-analytics
  calculation_logic: std(amount, ddof=1) / mean(amount) over salary credits in window; NaN if fewer than 2 salary credits
  window: 6 months
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - same-day availability.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-09-19'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-10-03'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.002
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-10-10'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-10-17'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
  null_reason: 'MNAR missing: undefined when the customer received fewer than 2 salary credits - the missingness itself is a risk signal (kept
    via missing-indicator).'
- name: account_age
  version: 1
  definition: Whole months since the customer signed up.
  source: customers.signup_date
  data_type: int (months)
  owner: retail-risk-analytics
  calculation_logic: (as_of.year - signup.year) * 12 + (as_of.month - signup.month)
  window: n/a (static)
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - signup_date is known at account opening.
  status: Approved
  stage: Production
  sensitivity: none
  history:
