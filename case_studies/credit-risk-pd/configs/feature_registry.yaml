      null_rate: 0.162
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-11-21'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-11-28'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
  derived_from:
  - credit_utilization
  - missed_payment_count
- name: balance_trend_norm
  version: 1
  definition: 'Balance trend relative to the balance level: a fall of 1,000/month matters more on a 5,000 balance than on 500,000.'
  source: 'derived: balance_trend, average_balance'
  data_type: float
  owner: retail-risk-analytics
  calculation_logic: clip(balance_trend / (abs(average_balance) + 1), -1, 1)
  window: same as parents
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - computed by add_derived_features() from balance_trend, average_balance; inherits the availability of its
    parents.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-10-31'
    by: A. Rao
