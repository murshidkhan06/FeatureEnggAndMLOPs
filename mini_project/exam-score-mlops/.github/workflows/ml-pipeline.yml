# .github/workflows/ml-pipeline.yml
#
# CI (PHASE 10): automatically tests code/data/model changes on every push/PR.
#
# CD (build + push the Docker image) is kept in a SEPARATE, manual-trigger job below --
# deliberately not run on every push, so the CI pipeline stays fast and cheap (per PHASE
# 10's "do not make the CI pipeline unnecessarily expensive"). See the job comments for
# the CI vs CD distinction spelled out.

name: ML Pipeline CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---- CI: automatically test code/data/model changes -----------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Regenerate dataset (deterministic, fixed seed)
        run: python data/raw/generate_data.py

      - name: Data validation
        run: python -c "from src.data_processing import load_raw_data; load_raw_data('data/raw/student_exam_scores.csv'); print('Data OK')"

      - name: Train the model (needed for model/API tests below)
        run: python -m src.train
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

      - name: Run test suite (data, feature, model, API tests)
        run: pytest tests/ -v

      - name: Build the application (import-check the API module)
        run: python -c "from api.main import app; print('API module imports cleanly:', app.title)"

  # ---- CD: optional, manually-triggered Docker build ------------------------------------
  # Distinguishing CI (above -- always runs, tests changes) from CD (below -- builds and
  # would package/deploy the application) is the point of PHASE 10. This job only RUNS the
  # build so the Dockerfile itself is validated in CI; it deliberately does not push to
  # Docker Hub from CI -- that step needs registry credentials as repo secrets
  # (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN), which this student template does not assume
  # you've configured. See the README's Docker Hub section for the manual push workflow.
  build-docker-image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Train the model (Docker build needs the artifact present)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python data/raw/generate_data.py
          python -m src.train
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

      - name: Build Docker image (validation only -- not pushed)
        run: docker build -t exam-score-api:ci .

      # To actually publish on your own fork, uncomment below and add
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN as repository secrets first.
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - name: Push image
      #   run: |
      #     docker tag exam-score-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/exam-score-api:latest
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/exam-score-api:latest
