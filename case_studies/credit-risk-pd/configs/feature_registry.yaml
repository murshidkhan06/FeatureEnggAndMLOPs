# FEATURE REGISTRY (feature metadata + lifecycle).  One entry per feature version.
# A feature can be used for training ONLY if status == Approved AND stage == Production (see src/governance/feature_lifecycle.py).
# Lifecycle:  Development -> Validation -> Approval -> Production   (or Rejected from Validation/Approval)
# A feature may enter Production only if its Validation record shows: leakage_test pass, null_rate <= max_null_rate,
# availability rule declared, owner assigned.   View as a table:  python -m src.governance.feature_lifecycle table
registry_version: 1
model: credit_risk_pd_model
stages:
- Development
- Validation
- Approval
- Production
validation_rules:
  max_null_rate: 0.2
  require_leakage_test_pass: true
  require_availability_rule: true
  require_owner: true
features:
- name: average_balance
  version: 2
  definition: Average balance of the current account over the last 90 days (customer's money buffer).
  source: transactions.balance_after
  data_type: float (INR)
  owner: retail-risk-analytics
  calculation_logic: mean(balance_after) over transactions with txn_date in (as_of_date - 90 days, as_of_date]
  window: 90 days
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - every transaction is posted the day it happens; we only use rows dated on or before as_of_date.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-10-24'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-11-07'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.0
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-11-14'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-11-21'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
  replaces: average_balance_leaky v1
  change_note: v1 averaged balances up to the OUTCOME date (leakage). v2 stops at as_of_date.
- name: balance_trend
  version: 1
  definition: 'Direction of the balance: OLS slope of the six month-end balances (INR per month). Negative = savings are being eaten.'
  source: transactions.balance_after
  data_type: float (INR / month)
  owner: retail-risk-analytics
  calculation_logic: slope of month-end balances for the 6 months ending at as_of_date (carry the last balance forward if a month has no transaction)
  window: 6 months
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - uses only month-end balances up to as_of_date.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-09-12'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-09-26'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.0
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-10-03'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-10-10'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
- name: salary_credit_frequency
  version: 1
  definition: 'How regularly salary arrives: salary credits per month over 6 months (1.0 = every month).'
  source: transactions.txn_type == salary_credit
  data_type: float (0..1)
  owner: retail-risk-analytics
  calculation_logic: count(salary_credit with txn_date in window) / 6
  window: 6 months
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - credits are posted the day they arrive.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-09-12'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-09-26'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.0
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-10-03'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-10-10'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
- name: loan_payment_ratio
  version: 1
  definition: Share of due loan instalments that were actually paid over 6 months.
  source: transactions.txn_type == loan_payment + customers.loan_start_date
  data_type: float (0..1)
  owner: retail-risk-analytics
  calculation_logic: payments made in window / instalments due in window (months after the loan start month); 1.0 if nothing was due
  window: 6 months
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - a payment is visible in the account the day it is made (earlier than loan_status, which is published 5 days
    later).
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-09-12'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-09-26'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.0
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-10-03'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-10-10'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
- name: missed_payment_count
  version: 1
  definition: Number of missed loan instalments in the last 6 PUBLISHED months of loan_status.
  source: loan_status.missed_payment
  data_type: int
  owner: retail-risk-analytics
  calculation_logic: sum(missed_payment) over loan_status months M-6 .. M-1 with available_at <= as_of_date
  window: 6 published months
  availability:
    lag_days: 5
    rule: available_at <= as_of_date
  prediction_time_availability: PARTLY - loan_status for month M is published on day 5 of month M+1, so at the month-end of M only months up to
    M-1 exist. The latest month is NOT used.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-09-12'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-09-26'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.0
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-10-03'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-10-10'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
- name: credit_utilization
  version: 1
  definition: 'How much of the credit-card limit the customer uses on average: mean monthly card spend / credit_limit.'
  source: transactions.txn_type == credit_card_spend + customers.credit_limit
  data_type: float (0..~1.2)
  owner: retail-risk-analytics
  calculation_logic: sum(credit_card_spend in window) / 6 / credit_limit  (empty if the customer has no card)
  window: 6 months
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - card purchases are posted the day they happen; credit_limit is a static attribute known at signup.
  status: Approved
  stage: Production
  sensitivity: none
  history:
  - stage: Development
    date: '2022-09-19'
    by: A. Rao
    note: Feature designed and prototyped in a notebook.
  - stage: Validation
    date: '2022-10-03'
    by: S. Iyer
    note: Independent validation checks run.
    checks:
      leakage_test: pass
      null_rate: 0.162
      availability_rule_declared: true
      owner_assigned: true
  - stage: Approval
    date: '2022-10-10'
    by: Model Risk Committee
    note: Approved for use in the PD early-warning model.
  - stage: Production
    date: '2022-10-17'
    by: MLOps team
    note: Added to the monthly feature pipeline and the online lookup.
  null_reason: 'MAR missing: customers without a credit card have no limit (about 16 % of rows). Imputed + missing-indicator inside the model
    pipeline.'
- name: recent_transaction_count
  version: 1
  definition: 'How active the account is right now: number of transactions in the last 30 days.'
  source: transactions (all types)
  data_type: int
  owner: retail-risk-analytics
  calculation_logic: count(rows with txn_date in (as_of_date - 30 days, as_of_date])
  window: 30 days
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - same-day availability.
  status: Approved
  stage: Production
  sensitivity: none
  history:
