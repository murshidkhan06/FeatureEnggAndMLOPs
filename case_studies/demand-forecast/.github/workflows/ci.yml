name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Generate data and train (small, deterministic)
        run: |
          python -m src.data.make_dataset
          python -m src.features.select_features
          python -m src.models.train --bootstrap-champion
      - name: Run tests (data, features, model, API)
        run: pytest -q
      - name: Model quality gate
        run: python scripts/quality_gate.py
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python -m src.data.make_dataset
          python -m src.features.select_features
          python -m src.models.train --bootstrap-champion
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/demand-forecast:${{ github.sha }} .
      - name: Push to Docker Hub (only on main, only if secrets exist)
        if: github.ref == 'refs/heads/main' && env.HAS_SECRETS == 'true'
        env: {HAS_SECRETS: "${{ secrets.DOCKERHUB_TOKEN != '' }}"}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/demand-forecast:${{ github.sha }}
      # Deployment to a real cluster is intentionally NOT automated here (needs credentials).
      # In class: `kubectl set image deployment/demand-forecast api=<image>` after the push.
