  - average_balance
- name: log_average_balance
  version: 1
  definition: Log of the average balance (log transform tames the long right tail; useful for the linear baseline).
  source: 'derived: average_balance'
  data_type: float
  owner: retail-risk-analytics
  calculation_logic: log1p(max(average_balance, 0))
  window: same as parents
  availability:
    lag_days: 0
    rule: available_at <= as_of_date
  prediction_time_availability: YES - computed by add_derived_features() from average_balance; inherits the availability of its parents.
  status: Approved
  stage: Production
  sensitivity: none
