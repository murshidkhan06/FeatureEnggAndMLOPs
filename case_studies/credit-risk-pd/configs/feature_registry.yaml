- name: average_balance_leaky
  version: 1
  definition: Average balance over the 90 days up to the data-EXTRACT date (as_of + 7 months, when the outcome is confirmed).
  source: transactions.balance_after
  data_type: float
  owner: retail-risk-analytics
  calculation_logic: mean(balance_after) over (as_of + 7 months - 90 days, as_of + 7 months]
  window: extends beyond as_of_date
  availability:
    lag_days: null
    rule: NOT DECLARED - uses data from the future
  prediction_time_availability: NO - at scoring time the next 6 months have not happened yet.
  status: Rejected
  stage: Rejected
  sensitivity: none
  rejection_reason: 'Leakage: includes the post-default balance collapse. Fails the future-perturbation test. Replaced by average_balance v2.'
  history:
  - stage: Development
    date: '2022-09-26'
    by: A. Rao
    note: Prototype showed a spectacular AUC (suspicious).
  - stage: Validation
    date: '2022-10-10'
    by: S. Iyer
    note: Validation FAILED.
    checks:
      leakage_test: FAIL
      null_rate: 0.0
      availability_rule_declared: false
      owner_assigned: true
  - stage: Rejected
    date: '2022-10-11'
    by: Model Risk Committee
    note: 'Leakage: includes the post-default balance collapse. Fails the future-perturbation test. Replaced by average_balance v2.'
- name: dpd_target_period
  version: 1
  definition: Maximum days_past_due inside the 6-month target window.
  source: loan_status.days_past_due
  data_type: float
  owner: retail-risk-analytics
  calculation_logic: max(days_past_due) for months in (as_of, as_of + 6 months]
  window: extends beyond as_of_date
  availability:
    lag_days: null
    rule: NOT DECLARED - uses data from the future
  prediction_time_availability: NO - future loan_status.
  status: Rejected
  stage: Rejected
  sensitivity: none
  rejection_reason: 'Target leakage: default IS 90+ days past due, so this column is the label in disguise.'
  history:
  - stage: Development
    date: '2022-09-26'
    by: A. Rao
    note: Prototype showed a spectacular AUC (suspicious).
  - stage: Validation
    date: '2022-10-10'
