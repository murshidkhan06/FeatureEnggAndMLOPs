global:
  scrape_interval: 10s
scrape_configs:
  - job_name: ml-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]          # when running outside compose use host.docker.internal:8000
  - job_name: drift-exporter
    static_configs:
      - targets: ["drift-exporter:9100"]
